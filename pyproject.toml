[project]
name = "ezviz-rtsp"
version = "1.0.8"
description = "Home Assistant integration for live view of EZVIZ cameras through the EZVIZ cloud, including battery cameras without RTSP"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
dependencies = ["pyezvizapi==1.0.5.0"]

[project.optional-dependencies]
dev = [
    "homeassistant>=2026.10.0",
    "pytest",
    "pytest-asyncio",
    "pytest-homeassistant-custom-component",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py314"
